<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promo template preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Noto+Kufi+Arabic:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F7;--surface:#fff;--ink:#14182B;--muted:#5B6480;--line:#D6DCEA;--accent:#7C3AED;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C0F1D;--surface:#171B30;--ink:#EEF1FF;--muted:#9AA3C4;--line:#2A3050}}
:root[data-theme="dark"]{--bg:#0C0F1D;--surface:#171B30;--ink:#EEF1FF;--muted:#9AA3C4;--line:#2A3050}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font:800 28px "Bricolage Grotesque",sans-serif;margin:6px 0 4px}p.sub{color:var(--muted);margin:0 0 14px}
#cv{display:block;width:min(100%,340px);aspect-ratio:9/16;margin:0 auto 12px;border-radius:26px;background:#0b0618;box-shadow:0 0 0 1px var(--line),0 18px 40px #0004}
.row{display:flex;gap:10px;margin-bottom:14px}
button{flex:1;font:600 16px Inter;border:0;border-radius:14px;padding:13px;background:var(--accent);color:#fff;cursor:pointer}button.alt{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>Promo template</h1>
<p class="sub">Template 1 preview. Change the text and style below and watch it update live.</p>
<canvas id="cv" width="720" height="1280" aria-label="Promo reel preview"></canvas>
<div class="row"><button id="pp" type="button">Pause</button><button class="alt" id="rp" type="button">Replay</button></div>
<div class="card">
<div class="two">
<div><label for="brand">Brand</label><input id="brand" value="Aymen Decor"></div>
<div><label for="niche">Niche</label><input id="niche" value="Wall art"></div>
</div>
<label for="head">Headline</label><input id="head" value="The winter collection is here">
<label for="ben">Three benefits (one per line)</label><textarea id="ben" rows="3">Laser-cut precision
Ships to all 58 wilayas
Pay on delivery</textarea>
<div class="two">
<div><label for="cta">Call to action</label><input id="cta" value="Order now"></div>
<div><label for="con">Contact</label><input id="con" value="+213 6 00 00 00 00"></div>
</div>
<div class="two">
<div><label for="lang">Language</label><select id="lang"><option value="en">English / French</option><option value="ar">Arabic / Darija</option></select></div>
<div><label for="pre">Color style</label><select id="pre"><option value="0">Purple glow</option><option value="1">Teal gold</option><option value="2">Rose sunset</option></select></div>
</div>
</div>
</div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d'),W=720,H=1280,TOT=14.6;
const PRE=[{a:'#FF8A5B',b:'#B455FF',c:'#2A0F5C',d:'#07030F'},{a:'#FFC857',b:'#19D3C5',c:'#08414A',d:'#021014'},{a:'#FFB36B',b:'#FF4D8D',c:'#4A0F2E',d:'#10040B'}];
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-cl(x),3);
const eb=x=>{x=cl(x);return 1+3.2*Math.pow(x-1,3)+2.2*Math.pow(x-1,2)};
const seg=(t,a,b)=>{const l=t-a,d=b-a;return{l,on:t>=a&&t<b,al:cl(eo(l/.4)*(1-eo((l-(d-.35))/.35)))}};
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
let S,P;
const F=(w,s)=>w+' '+s+'px '+(S.rtl?'"Noto Kufi Arabic"':'"Bricolage Grotesque"')+',Inter,sans-serif';
function read(){S={brand:$('#brand').value,niche:$('#niche').value,head:$('#head').value,ben:$('#ben').value.split('\n').filter(x=>x.trim()).slice(0,3),cta:$('#cta').value,con:$('#con').value,rtl:$('#lang').value==='ar'};P=PRE[+$('#pre').value]}
function bg(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,P.c);g.addColorStop(1,P.d);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  [[P.b,.5+.2*Math.sin(t*.6),.25+.1*Math.cos(t*.5),520],[P.a,.8+.1*Math.cos(t*.7),.75+.08*Math.sin(t*.4),460]].forEach(o=>{
    const x=o[1]*W,y=o[2]*H,r=ctx.createRadialGradient(x,y,0,x,y,o[3]);r.addColorStop(0,o[0]+'55');r.addColorStop(1,o[0]+'00');ctx.fillStyle=r;ctx.fillRect(0,0,W,H)});
  for(let i=0;i<10;i++)for(let j=0;j<16;j++){const w=.5+.5*Math.sin(t*2.2-i*.5-j*.35);ctx.globalAlpha=.1+.3*w*w;ctx.fillStyle=w>.8?P.a:'#fff';ctx.beginPath();ctx.arc(60+i*66,70+j*74,3+3*w*w,0,7);ctx.fill()}
  ctx.globalAlpha=1;
}
function words(text,cy,maxW,fs,start,t,hiLast){
  ctx.font=F(800,fs);ctx.textBaseline='middle';ctx.textAlign='center';ctx.direction='ltr';
  const ws=text.split(/\s+/).filter(Boolean),m=ws.map(w=>ctx.measureText(w).width),sp=fs*.3,ls=[];let cur=[],cw=0;
  ws.forEach((w,k)=>{const a=(cur.length?sp:0)+m[k];if(cw+a>maxW&&cur.length){ls.push(cur);cur=[k];cw=m[k]}else{cur.push(k);cw+=a}});ls.push(cur);
  const lh=fs*1.25,y0=cy-ls.length*lh/2;
  ls.forEach((ln,li)=>{const lw=ln.reduce((s,k,j)=>s+m[k]+(j?sp:0),0);let x=S.rtl?(W+lw)/2:(W-lw)/2;
    ln.forEach(k=>{const age=t-start-k*.18,p=eb(age/.5),cx=S.rtl?x-m[k]/2:x+m[k]/2;
      if(age>0){ctx.save();ctx.translate(cx,y0+li*lh+lh/2+(1-p)*40);ctx.scale(.75+.25*p,.75+.25*p);ctx.globalAlpha=cl(age/.2);ctx.shadowColor=P.b+'99';ctx.shadowBlur=30;
        ctx.fillStyle=(hiLast&&k===ws.length-1)?P.a:'#fff';ctx.fillText(ws[k],0,0);ctx.restore()}
      x+=S.rtl?-(m[k]+sp):m[k]+sp})});
}
function pill(text,cx,cy,fs,fill,tc,sc){
  ctx.font=F(700,fs);ctx.textAlign='center';ctx.textBaseline='middle';const w=ctx.measureText(text).width+fs*1.6,h=fs*2;
  ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.shadowColor=P.a+'aa';ctx.shadowBlur=fill?40:0;
  if(fill){ctx.fillStyle=fill;rr(-w/2,-h/2,w,h,h/2);ctx.fill()}else{ctx.strokeStyle=P.a;ctx.lineWidth=3;rr(-w/2,-h/2,w,h,h/2);ctx.stroke()}
  ctx.shadowBlur=0;ctx.fillStyle=tc;ctx.fillText(text,0,2);ctx.restore();
}
function card(cx,cy,w,h,rot,c1,c2,t,main){
  ctx.save();ctx.translate(cx,cy+8*Math.sin(t*1.6+rot*9));ctx.rotate(rot);ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=50;ctx.shadowOffsetY=20;
  const g=ctx.createLinearGradient(-w/2,-h/2,w/2,h/2);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;rr(-w/2,-h/2,w,h,38);ctx.fill();
  ctx.shadowColor='transparent';ctx.save();rr(-w/2,-h/2,w,h,38);ctx.clip();ctx.fillStyle='rgba(255,255,255,.14)';
  for(let i=-3;i<5;i++){ctx.save();ctx.rotate(-.5);ctx.fillRect(-w+i*90,-h,36,h*2);ctx.restore()}
  const s=ctx.createRadialGradient(0,-h*.05,0,0,-h*.05,w*.28);s.addColorStop(0,'#fff');s.addColorStop(1,P.a);ctx.fillStyle=s;ctx.beginPath();ctx.arc(0,-h*.05,w*.26,0,7);ctx.fill();ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(-w/2+50,-h/2+50,22,0,7);ctx.fill();
  if(main){ctx.font=F(700,24);ctx.textAlign='left';ctx.direction='ltr';ctx.fillStyle='#fff';ctx.fillText('@'+S.brand.toLowerCase().replace(/\s+/g,''),-w/2+84,-h/2+50);
    ctx.fillStyle='rgba(255,255,255,.95)';rr(-w/2+34,h/2-96,w*.7,16,8);ctx.fill();ctx.fillStyle='rgba(255,255,255,.55)';rr(-w/2+34,h/2-62,w*.45,14,7);ctx.fill()}
  ctx.restore();
}
function draw(t){
  bg(t);ctx.direction=S.rtl?'rtl':'ltr';
  let s=seg(t,0,2.8);if(s.on){ctx.save();ctx.globalAlpha=s.al;pill(S.niche,W/2,470,34,null,'#fff',eb(s.l/.5));
    ctx.font=F(600,40);ctx.fillStyle='rgba(255,255,255,.75)';ctx.textAlign='center';ctx.fillText(S.rtl?'نقدّم لكم':'Introducing',W/2,560);
    ctx.save();ctx.beginPath();ctx.rect(0,590,W,170);ctx.clip();ctx.font=F(800,Math.min(130,W*1.5/Math.max(6,S.brand.length)*1.6));ctx.fillStyle='#fff';ctx.shadowColor=P.b;ctx.shadowBlur=40;ctx.fillText(S.brand,W/2,680+(1-eo((s.l-.3)/.6))*170);ctx.restore();ctx.restore()}
  s=seg(t,2.6,5.8);if(s.on){ctx.save();ctx.globalAlpha=s.al;words(S.head,H/2-20,600,92,2.8,t,true);ctx.restore()}
  s=seg(t,5.6,9);if(s.on){ctx.save();ctx.globalAlpha=s.al;const a=eo(s.l/.8),b=eb(s.l/.9);
    card(W/2-210-(1-a)*500,H/2+30,330,520,-.2,P.b,P.c,t,0);card(W/2+210+(1-a)*500,H/2+30,330,520,.2,P.a,P.b,t,0);
    ctx.save();ctx.translate(W/2,H/2+10);ctx.scale(.6+.4*b,.6+.4*b);ctx.translate(-W/2,-H/2-10);card(W/2,H/2+10,400,640,0,P.b,P.d,t,1);ctx.restore();ctx.restore()}
  s=seg(t,8.8,11.6);if(s.on){ctx.save();ctx.globalAlpha=s.al;S.ben.forEach((b,i)=>{const p=eb((s.l-.15-i*.3)/.5),y=H/2-170+i*170;
    ctx.save();ctx.translate(W/2,y+(1-p)*50);ctx.globalAlpha=s.al*cl(p*2);ctx.fillStyle='rgba(255,255,255,.1)';ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2;rr(-300,-60,600,120,40);ctx.fill();ctx.stroke();
    const cx=S.rtl?236:-236;ctx.fillStyle=P.a;ctx.beginPath();ctx.arc(cx,0,34,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(cx-14,1);ctx.lineTo(cx-3,12);ctx.lineTo(cx+16,-10);ctx.stroke();
    ctx.font=F(600,38);ctx.fillStyle='#fff';ctx.textAlign=S.rtl?'right':'left';ctx.textBaseline='middle';ctx.fillText(b,S.rtl?190:-186,2);ctx.restore()});ctx.restore()}
  s=seg(t,11.4,TOT+1);if(s.on){ctx.save();ctx.globalAlpha=cl(eo(s.l/.4));const p=eb(s.l/.6),pu=1+.035*Math.sin(s.l*7);
    ctx.font=F(600,44);ctx.fillStyle='rgba(255,255,255,.8)';ctx.textAlign='center';ctx.fillText(S.brand,W/2,H/2-190+(1-p)*40);
    ctx.save();ctx.strokeStyle=P.a;ctx.globalAlpha=.4*(1-(s.l*.8%1));ctx.lineWidth=4;rr(W/2-230-(s.l*.8%1)*60,H/2-70-(s.l*.8%1)*30,460+(s.l*.8%1)*120,140+(s.l*.8%1)*60,70+(s.l*.8%1)*30);ctx.stroke();ctx.restore();
    pill(S.cta,W/2,H/2,64,P.a,'#fff',p*pu);ctx.direction='ltr';ctx.font=F(600,42);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(S.con,W/2,H/2+170);ctx.restore()}
  ctx.fillStyle='rgba(255,255,255,.18)';rr(40,44,W-80,6,3);ctx.fill();ctx.fillStyle=P.a;rr(40,44,Math.max(6,(W-80)*t/TOT),6,3);ctx.fill();
}
let t0=performance.now(),paused=false,tp=0;
function loop(){read();const t=paused?tp:((performance.now()-t0)/1000)%(TOT+1);tp=t;draw(t);requestAnimationFrame(loop)}
$('#pp').onclick=()=>{paused=!paused;if(!paused)t0=performance.now()-tp*1000;$('#pp').textContent=paused?'Play':'Pause'};
$('#rp').onclick=()=>{t0=performance.now();paused=false;$('#pp').textContent='Pause'};
window.frame=t=>{read();draw(t)};window.TOTAL=TOT;
if(location.hash!=='#render'){Promise.all([document.fonts.load('800 60px "Bricolage Grotesque"'),document.fonts.load('600 40px "Noto Kufi Arabic"')]).catch(()=>{}).finally(()=>{t0=performance.now();loop()});}
</script>
</body>
</html>
