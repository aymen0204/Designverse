<title>Designverse story template</title>

#cv{display:block;width:min(100%,340px);aspect-ratio:9/16;margin:0 auto 12px;border-radius:24px;background:#0a0614}

input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

<canvas id="cv" width="720" height="1280" aria-label="Reel preview"></canvas>
<div class="row"><button id="pp" type="button">Pause</button><button class="alt" id="rp" type="button">Replay</button></div>
<div class="card">
<div class="two"><div><label for="brand">Brand</label><input id="brand" value="Aymen Decor"></div><div><label for="niche">Niche</label><input id="niche" value="Wall art"></div></div>
<label for="hook">Hook</label><input id="hook" value="Your walls feel empty.">
<label for="pains">Pain words (3 lines)</label><textarea id="pains" rows="3">Blank
Boring
Forgettable</textarea>
<div class="two"><div><label for="painend">After the pains</label><input id="painend" value="Not anymore."></div><div><label for="tagline">Tagline</label><input id="tagline" value="Art that fits your story."></div></div>
<label for="labels">Labels (3 lines)</label><textarea id="labels" rows="3">Laser-cut precision
Made to order
Ships everywhere</textarea>
<div class="two"><div><label for="offerbig">Big offer</label><input id="offerbig" value="4500 DA"></div><div><label for="offersmall">Offer detail</label><input id="offersmall" value="for 2 pieces"></div></div>
<label for="proof">Proof line</label><input id="proof" value="Delivered to all 58 wilayas">
<div class="two"><div><label for="cta">Call to action</label><input id="cta" value="Order now"></div><div><label for="con">Contact</label><input id="con" value="+213 6 00 00 00 00"></div></div>
<div class="two"><div><label for="lang">Language</label><select id="lang"><option value="en">English</option><option value="fr">French</option><option value="ar">Arabic</option></select></div><div><label for="pre">Colors</label><select id="pre"><option value="0">Purple glow</option><option value="1">Teal gold</option><option value="2">Rose sunset</option></select></div></div>
<label for="pic">Product photos (optional)</label><input id="pic" type="file" accept="image/*" multiple>
</div></div>
