<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Designverse Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#F5F4FB;--card:#FFFFFF;--ink:#17132E;--muted:#6E6A8A;--line:#E7E4F4;--violet:#5B2EE0;--violet2:#8B5CF6;--tint:#EFEAFE;--accent:#E8664F;--accent2:#EBA82B;--ok:#13A06F;--shadow:0 1px 2px rgba(23,19,46,.05),0 10px 28px rgba(23,19,46,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0D1E;--card:#1A1730;--ink:#F2F0FF;--muted:#A29EC4;--line:#2D2950;--violet:#A58BFF;--violet2:#7C5CF0;--tint:#272244;--ok:#3DD6A0;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0F0D1E;--card:#1A1730;--ink:#F2F0FF;--muted:#A29EC4;--line:#2D2950;--violet:#A58BFF;--violet2:#7C5CF0;--tint:#272244;--ok:#3DD6A0;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em;font-weight:800}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 120px}
.clay{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.clay.hero{background:linear-gradient(135deg,var(--tint),var(--card) 85%);}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 16px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;gap:9px;align-items:center}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--violet),var(--violet2))}
.who{color:var(--muted);font-size:14px;font-weight:600}
h1{font-size:28px}h2{font-size:19px;margin-bottom:6px}h3{font-size:16px}
h1 .v,.v{color:var(--violet)}
.sub{color:var(--muted);margin:6px 0 16px}
.btn{font:700 16px "Plus Jakarta Sans",sans-serif;color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));border:0;border-radius:999px;padding:15px 24px;width:100%;cursor:pointer;box-shadow:0 8px 20px rgba(232,102,79,.28)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6}
.btn.soft{background:transparent;color:var(--violet);border:1.5px solid var(--line);box-shadow:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
label{display:block;font-weight:700;font-size:13px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px}
input:focus{border-color:var(--violet)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 14px "Plus Jakarta Sans",sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:10px 15px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--violet);border-color:var(--violet);color:#fff}
@media (prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#120E2A}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}.stat span{color:var(--muted);font-size:13px;font-weight:600}
.bar{height:8px;border-radius:8px;background:var(--tint);overflow:hidden;margin:12px 0 6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--violet2));border-radius:8px}
.pill{display:inline-block;font-weight:700;font-size:12px;color:var(--violet);background:var(--tint);padding:4px 12px;border-radius:99px}
.reel{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.reel:first-of-type{border-top:0}
.thumb{width:54px;aspect-ratio:9/16;border-radius:10px;background:linear-gradient(110deg,var(--tint) 30%,var(--card) 50%,var(--tint) 70%);background-size:200% 100%;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}@media (prefers-reduced-motion:reduce){.thumb{animation:none}}
.plan{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer}
.plan[aria-pressed=true]{border-color:var(--violet);background:var(--tint)}
.plan b{font-weight:800;font-size:17px}.plan span{color:var(--muted);font-size:13px}.plan em{font-weight:800;font-size:22px;font-style:normal}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{border:0;background:none;font:700 13px "Plus Jakarta Sans",sans-serif;color:var(--muted);padding:11px 4px;border-radius:12px;cursor:pointer}
nav button[aria-current=page]{background:var(--tint);color:var(--violet)}
a.link{color:var(--violet);font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav" hidden><div id="tabs"></div></nav>
<script>
window.addEventListener('error',e=>{const a=document.getElementById('app');if(a){a.textContent='';const d=document.createElement('div');d.className='clay';d.textContent='Error: '+e.message+' (line '+e.lineno+')';a.append(d)}});
const SUPABASE_URL='https://bfxrhbnjlrjpwtvoollf.supabase.co', SUPABASE_KEY='sb_publishable_maATwmr4IXXqNxUp8LG1LA_ZlQeXb37';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let initErr='';
let sess=null;try{sess=JSON.parse(localStorage.getItem('dvs'))}catch(_){}
const saveSess=v=>{sess=v;try{v?localStorage.setItem('dvs',JSON.stringify(v)):localStorage.removeItem('dvs')}catch(_){}};
const hdr=t=>({'apikey':SUPABASE_KEY,'Content-Type':'application/json',...(t?{'Authorization':'Bearer '+t}:{})});
async function refresh(){try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:hdr(),body:JSON.stringify({refresh_token:sess.refresh_token})});if(!r.ok)return false;const j=await r.json();saveSess({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user});return true}catch(_){return false}}
async function jf(path,opt={},auth=true){
  const go=()=>fetch(SUPABASE_URL+path,{...opt,headers:{...hdr(auth&&sess?sess.access_token:null),...(opt.headers||{})}});
  let r=await go();
  if(r.status===401&&auth&&sess&&sess.refresh_token&&await refresh())r=await go();
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(_){}
  if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description||j.error))||('HTTP '+r.status));
  return j;
}
async function run(st){try{const q='?'+(st.m==='GET'?'select=*&':'')+st.f.join('&')+st.o;
  const j=await jf('/rest/v1/'+st.t+q,{method:st.m,headers:st.m==='PATCH'?{Prefer:'return=minimal'}:{},body:st.b?JSON.stringify(st.b):undefined});
  return{data:st.one?((j&&j[0])||null):j,error:null}}catch(e){return{data:null,error:e}}}
const sb={
  auth:{
    async getSession(){return{data:{session:sess}}},
    async signInWithPassword(o){try{const j=await jf('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify(o)},false);saveSess(j);return{data:{session:j},error:null}}catch(e){return{data:{},error:e}}},
    async signUp(o){try{const j=await jf('/auth/v1/signup',{method:'POST',body:JSON.stringify(o)},false);if(j&&j.access_token)saveSess(j);return{data:{session:j&&j.access_token?j:null},error:null}}catch(e){return{data:{},error:e}}},
    async signOut(){try{await jf('/auth/v1/logout',{method:'POST'})}catch(_){}saveSess(null);return{}}
  },
  from(t){const st={t,f:[],o:'',m:'GET',b:null,one:false};
    const b={select(){return b},eq(k,v){st.f.push(k+'=eq.'+encodeURIComponent(v));return b},order(c){st.o='&order='+c+'.asc';return b},single(){st.one=true;return b},update(o){st.m='PATCH';st.b=o;return b},then(res,rej){return run(st).then(res,rej)}};
    return b},
  async rpc(n,a){try{await jf('/rest/v1/rpc/'+n,{method:'POST',body:JSON.stringify(a)});return{error:null}}catch(e){return{error:e}}},
  storage:{from(){return{async createSignedUrl(p,sec){try{const j=await jf('/storage/v1/object/sign/reels/'+p,{method:'POST',body:JSON.stringify({expiresIn:sec})});return{data:{signedUrl:SUPABASE_URL+'/storage/v1'+j.signedURL},error:null}}catch(e){return{data:null,error:e}}}}}}
};
const ok=true;
const PLANS={Starter:[10,9],Growth:[30,24],Pro:[60,39]};
const OPT={lang:['Arabic','Darija','French','English'],dur:['30 seconds','45 seconds','1 minute'],type:['Product showcase','Promo / offer','Tips & tutorial','Storytelling','Customer testimonial','Behind the scenes'],goal:['Sell a product','Promote an offer','Brand awareness','Get more followers'],style:['Modern & clean','Luxury','Fun & colorful','Minimal','Bold & energetic'],cta:['Order now','Send us a message','Link in bio','Call or WhatsApp us','No call to action'],niche:['Fashion','Cosmetics','Food','Home decor','Tech & apps','Other']};
let S={tab:'home',user:null,onboarded:false,plan:'Starter',lang:'Arabic'},R=[],mode='in',busy=false;
const chips=k=>'<div class="chips" role="group" aria-label="'+k+'">'+OPT[k].map(o=>'<button class="chip" type="button" data-k="'+k+'" data-v="'+esc(o)+'" aria-pressed="'+(S[k]===o)+'">'+esc(o)+'</button>').join('')+'</div>';
const trialEnd=()=>new Date(new Date(S.trial_start||Date.now()).getTime()+3*864e5).toLocaleDateString('en',{month:'short',day:'numeric'});
const hd=()=>'<div class="top"><div class="logo"><i></i>Designverse</div><div class="who">'+esc(S.brand||'')+'</div></div>';
async function load(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){S={tab:'home',user:null,onboarded:false,plan:'Starter',lang:'Arabic'};R=[];return view()}
  const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  S={...S,...(p||{}),user:session.user};
  const {data:r}=await sb.from('reels').select('*').order('created_at');R=r||[];view();
}
function view(){
  const app=$('#app'),nav=$('#nav');nav.hidden=true;
  if(!ok){app.innerHTML=hd()+'<div class="clay"><h2>Almost ready</h2><p class="sub">Could not start: '+esc(initErr)+'</p></div>';return}
  if(!S.user){
    app.innerHTML=hd()+'<div class="clay"><h1>'+(mode==='up'?'Create your account':'Welcome back')+'</h1><p class="sub">Free trial. 3 free reels.</p><label for="em">Email</label><input id="em" type="email" autocomplete="email"><label for="pw">Password</label><input id="pw" type="password" autocomplete="'+(mode==='up'?'new-password':'current-password')+'" placeholder="At least 6 characters"><div style="height:18px"></div><button class="btn" id="auth" type="button">'+(mode==='up'?'Sign up':'Sign in')+'</button><p class="sub" id="err" role="alert"></p><button class="btn soft" id="swap" type="button">'+(mode==='up'?'I already have an account':'Create an account')+'</button></div>';return}
  if(!S.onboarded){
    app.innerHTML=hd()+'<div class="clay"><h1>Get 3 free reels</h1><p class="sub">Tell us about your brand. That is all we need.</p><label for="b">Brand name</label><input id="b" value="'+esc(S.brand)+'" placeholder="e.g. Aymen Decor" autocomplete="off"><label>Niche</label>'+chips('niche')+'<label>Reel language</label>'+chips('lang')+'<div style="height:20px"></div><button class="btn" id="go" type="button">Start free trial</button><p class="sub" id="err" role="alert"></p></div>';return}
  nav.hidden=false;
  $('#tabs').innerHTML=[['home','Home'],['custom','Customize'],['reels','My reels'],['plan','Plan']].map(t=>'<button type="button" data-tab="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>').join('');
  const [n,p]=PLANS[S.plan]||PLANS.Starter,ready=R.filter(r=>r.status==='ready').length;let h=hd();
  if(S.tab==='home')h+='<div class="clay hero"><h1>Welcome back, <span class="v">'+esc(S.brand)+'</span>!</h1><p class="sub">'+(ready?'You have '+ready+' reel'+(ready>1?'s':'')+' ready to download.':'Your reels are being prepared. We will email you as soon as they are here.')+'</p><button class="btn" data-tab="reels" type="button">'+(ready?'View my reels':'See progress')+'</button></div>'
   +'<div class="clay"><span class="pill">Free trial</span><h2 style="margin-top:10px">'+esc(S.plan)+' · $'+p+' / month</h2><p class="sub" style="margin:0">'+n+' reels / month · free until '+trialEnd()+'</p><div class="bar"><i style="width:'+Math.max(4,ready/n*100)+'%"></i></div><span class="sub">Delivered '+ready+' / '+n+'</span><div style="height:12px"></div><button class="btn soft" data-tab="plan" type="button">Manage my plan</button></div>'
   +'<div class="grid"><div class="stat"><b>'+ready+'</b><span>Reels delivered</span></div><div class="stat"><b>'+n+'</b><span>Reels per month</span></div><div class="stat"><b>2–7 h</b><span>Delivery time</span></div><div class="stat"><b>'+trialEnd()+'</b><span>Free trial ends</span></div></div>';
  if(S.tab==='custom')h+='<div class="clay"><h1>Customize your reels</h1><p class="sub">Pick what you want. You can change it anytime.</p><label>Duration</label>'+chips('dur')+'<label>Reel type</label>'+chips('type')+'<label>Goal</label>'+chips('goal')+'<label>Style</label>'+chips('style')+'<label>Language</label>'+chips('lang')+'<label>Call to action at the end</label>'+chips('cta')+'<label for="c">WhatsApp, website or shop address (optional)</label><input id="c" value="'+esc(S.contact)+'" placeholder="+213 6 00 00 00 00"><div style="height:18px"></div><button class="btn" id="sv" type="button">Save my settings</button><p class="sub" id="ok" role="status"></p></div>';
  if(S.tab==='reels'){h+='<div class="clay"><h1>Your reels</h1><p class="sub">Ready to download and post anywhere.</p>';
    R.forEach((r,i)=>{const rd=r.status==='ready';h+='<div class="reel"><div class="thumb"'+(rd?' style="animation:none;background:var(--accent)"':'')+'></div><div style="flex:1"><h3>Reel '+(i+1)+'</h3><span class="sub">'+(rd?'Ready':r.status==='failed'?'Something went wrong. We are fixing it.':'Being prepared · by about '+new Date(r.due_at).toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'}))+'</span></div>'+(rd&&r.video_path?'<button class="chip" type="button" data-dl="'+esc(r.video_path)+'">Download</button>':'')+'</div>'});
    h+='<p class="sub">We will email you when they are ready.</p></div>'}
  if(S.tab==='plan'){h+='<div class="clay"><h1>Your plan</h1><p class="sub">Free for 3 days, then billed monthly. Cancel anytime.</p>'+Object.entries(PLANS).map(([k,v])=>'<button class="plan" type="button" data-plan="'+k+'" aria-pressed="'+(S.plan===k)+'"><div><b>'+k+'</b><br><span>'+v[0]+' reels / month</span></div><em>$'+v[1]+'</em></button>').join('')+'<p class="sub">Payment is not connected yet.</p><button class="btn soft" id="out" type="button">Sign out</button></div>'}
  app.innerHTML=h;
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-k],[data-tab],[data-plan],[data-dl],button[id]');if(!t||busy)return;
  const err=m=>{const x=$('#err');if(x)x.textContent=m};
  if(t.dataset.k){const b=$('#b');if(b)S.brand=b.value;S[t.dataset.k]=t.dataset.v;const y=scrollY;view();scrollTo(0,y);return}
  if(t.dataset.tab){S.tab=t.dataset.tab;view();scrollTo(0,0);return}
  if(t.dataset.plan){S.plan=t.dataset.plan;view();await sb.from('profiles').update({plan:S.plan}).eq('id',S.user.id);return}
  if(t.dataset.dl){const {data,error}=await sb.storage.from('reels').createSignedUrl(t.dataset.dl,3600);if(data)window.open(data.signedUrl,'_blank','noopener');return}
  if(t.id==='swap'){mode=mode==='up'?'in':'up';view();return}
  busy=true;t.disabled=true;
  try{
    if(t.id==='auth'){
      const em=$('#em').value.trim(),pw=$('#pw').value;
      const {data,error}=mode==='up'?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});
      if(error)err(error.message);else if(!data.session)err('Check your email to confirm your account, then sign in.');else await load();
    }else if(t.id==='go'){
      const b=$('#b').value.trim();if(!b||!S.niche){err('Please enter your brand name and pick a niche.')}
      else{const {error}=await sb.rpc('start_trial',{p_brand:b,p_niche:S.niche,p_lang:S.lang});if(error)err(error.message);else await load()}
    }else if(t.id==='sv'){
      S.contact=$('#c').value;
      const {error}=await sb.from('profiles').update({lang:S.lang,dur:S.dur,type:S.type,goal:S.goal,style:S.style,cta:S.cta,contact:S.contact}).eq('id',S.user.id);
      $('#ok').textContent=error?'Could not save. Try again.':'Saved. Your next reels will use these settings.';
    }else if(t.id==='out'){await sb.auth.signOut();await load()}
  }catch(x){err('Network problem. Try again.')}
  busy=false;const bb=document.getElementById(t.id);if(bb)bb.disabled=false;
});
$('#app').innerHTML=hd()+'<div class="clay"><p class="sub">Loading…</p></div>';
if(ok)load().catch(e=>{S.user=null;view();const x=$('#err');if(x)x.textContent=e.message});else view();
</script>
</body>
</html>
