<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Designverse test</title>
<style>body{margin:0;padding:20px;font:17px/1.5 -apple-system,system-ui,sans-serif;background:#fff;color:#000}h1{font-size:24px}p{margin:10px 0;padding:10px;border-radius:10px;background:#eee;word-break:break-word}.ok{background:#c9f2d3}.bad{background:#ffd0d0}</style></head>
<body><h1>Designverse test</h1>
<p class="ok">1. This page loaded.</p>
<div id="out"></div>
<script>
const U='https://bfxrhbnjlrjpwtvoollf.supabase.co',K='sb_publishable_maATwmr4IXXqNxUp8LG1LA_ZlQeXb37';
const out=document.getElementById('out');
function say(t,good){const p=document.createElement('p');p.className=good?'ok':'bad';p.textContent=t;out.append(p)}
say('2. JavaScript runs.',true);
(async()=>{
  try{const r=await fetch('index.html?x='+Date.now());const t=await r.text();
    say('3. index.html is '+t.length+' characters. '+(t.includes('Loading')?'It is the NEW version.':'It is the OLD version, upload it again.')+' Uses CDN library: '+(t.includes('jsdelivr')?'yes (old)':'no (new)'),t.includes('Loading'))}
  catch(e){say('3. Could not read index.html: '+e.message,false)}
  try{const r=await fetch(U+'/auth/v1/settings',{headers:{apikey:K}});say('4. Supabase auth reachable. Status '+r.status,r.ok)}
  catch(e){say('4. Cannot reach Supabase: '+e.message,false)}
  try{const r=await fetch(U+'/rest/v1/profiles?select=id&limit=1',{headers:{apikey:K}});const t=await r.text();say('5. Database table check. Status '+r.status+' '+t.slice(0,150),r.status!==404)}
  catch(e){say('5. Database check failed: '+e.message,false)}
})();
</script></body></html>
